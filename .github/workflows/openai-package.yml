name: openai-package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Validate and build the ChatGPT plugin ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Build the pull request's own commit, not GitHub's test merge with main,
          # so the ZIP matches a commit on the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test the build script
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Validate and build
        run: python3 scripts/build-openai-zip.py
      - name: Upload the ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatgpt-plugin-zip
          path: dist/*.zip
          if-no-files-found: error
